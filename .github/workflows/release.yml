name: Release APK

# Builds the signed APK for a GitHub release and attaches it to that release.
# Runs when a release is published (tag vX.Y.Z), or by hand for an existing tag.
# Signing key and password come from repository secrets; see docs/RELEASE.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the APK to, e.g. v1.2.0
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload the APK to the release.
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Certificate of the release key (public, not a secret): a different key is refused, because
      # Android would not install such an APK over the existing app.
      EXPECTED_CERT_SHA256: 1486aa8d1ebacfa192ccf5dc94bb39c7adf7e4992927bee394baadda4061977d
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Matches gradle/gradle-daemon-jvm.properties so Gradle does not download another JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' androidApp/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in androidApp/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Read by androidApp/build.gradle.kts; never committed.
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=ownexpenses"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest

      - name: Build signed APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found (was keystore.properties read?). Release outputs:"
            ls androidApp/build/outputs/apk/release/
            exit 1
          fi
          # The newest build-tools that actually ships apksigner (preview folders may not).
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          # "Signer #1 certificate SHA-256 digest: …" before build-tools 37, "V2 Signer: certificate …" since.
          # Every signer must be the release key, so all digests found must be that one.
          actual=$(echo "$certs" | sed -n -E 's/.*[Ss]igner.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | sort -u)
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $actual, expected the release key $EXPECTED_CERT_SHA256"
            exit 1
          fi
          cp "$apk" "OwnExpenses-$VERSION.apk"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "OwnExpenses-$VERSION.apk" --clobber

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
